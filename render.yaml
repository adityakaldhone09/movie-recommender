services:
  - type: web
    name: movie-recommender-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TMDB_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://movie-recommender-th84-ni8srki03-adityakaldhone0486-2052.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
